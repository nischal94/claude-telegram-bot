name: actionlint

# Static analysis for GitHub Actions workflow YAML. Catches typos in
# expressions, undefined contexts, unsafe shell patterns, and broken
# `if:` conditions BEFORE they fail at runtime in some unlucky branch.
#
# Only runs when workflow files themselves change — nothing to lint
# otherwise.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned release tarball, checked against its published SHA-256.
      # Dependabot does not update this pin: bump the version and the
      # checksum together by hand.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
      - name: Run actionlint
        run: ./actionlint -color
