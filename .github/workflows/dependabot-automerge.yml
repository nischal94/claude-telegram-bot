name: Dependabot auto-merge

# Auto-merges patch updates of GitHub Actions only. Actions are pinned to
# commit SHAs, and Dependabot waits 7 days after each release (see
# .github/dependabot.yml).
#
# Engine package updates (bun ecosystem) never auto-merge: that code runs
# as the owner, so every update gets a human review. All other Dependabot
# PRs also require review. Auto-merge respects required status checks.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Auto-merge eligible updates
        # package-ecosystem comes from the Dependabot branch name,
        # e.g. dependabot/github_actions/actions/checkout-7.
        if: |
          steps.meta.outputs.package-ecosystem == 'github_actions' &&
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
