version: 2

# Dependabot updates GitHub Actions and the engine's bun dependencies. The
# pip, npm and docker blocks below are commented-out templates.
#
# Each enabled ecosystem waits 7 days after a release before proposing it,
# so a compromised release has time to be found and pulled first. Give any
# block you uncomment the same cooldown. The cooldown does not delay
# security updates.
#
# GitHub's dependency graph does not read bun.lock, so Dependabot alerts and
# security updates cover only the engine's direct dependencies. The
# engine-tests workflow runs `bun audit` on the whole lockfile.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    # include: "scope" adds "(deps)" after the prefix: "ci(deps): bump ...".
    commit-message:
      prefix: "ci"
      include: "scope"

  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #     day: "monday"
  #   open-pull-requests-limit: 5
  #   labels: ["dependencies"]
  #   commit-message:
  #     prefix: "chore"
  #     include: "scope"

  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #     day: "monday"
  #   open-pull-requests-limit: 5
  #   labels: ["dependencies"]
  #   commit-message:
  #     prefix: "chore"
  #     include: "scope"

  # - package-ecosystem: "docker"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   labels: ["dependencies", "docker"]

  # The engine's manifest and bun.lock live in /engine. The "bun" ecosystem
  # updates bun.lock together with package.json.
  - package-ecosystem: "bun"
    directory: "/engine"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
      bun-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
